{% extends "base.html" %}

{% block title %}{{ t('sms_header_title') }} - {{ t('brand_title') }}{% endblock %}

{% block content %}
<div class="form-card">
    <div class="card-header-bar">
        <div class="card-header-icon" aria-hidden="true">💬</div>
        <div class="card-header-text">
            <h2>{{ t('sms_header_title') }}</h2>
            <p>{{ t('sms_header_desc') }}</p>
        </div>
    </div>

    <!-- Mode Selection Tabs -->
    <div class="input-tabs" role="tablist">
        <button type="button" class="tab-btn active" data-tab="paste-tab" role="tab" aria-selected="true" aria-controls="paste-tab">
            {{ t('tab_paste_text') }}
        </button>
        <button type="button" class="tab-btn" data-tab="upload-tab" role="tab" aria-selected="false" aria-controls="upload-tab">
            {{ t('tab_upload_screenshot') }}
        </button>
    </div>

    <!-- Form 1: Paste Text -->
    <div id="paste-tab" class="tab-panel" role="tabpanel">
        <form action="{{ url_for('analyze_sms') }}" method="POST">
            <input type="hidden" name="input_mode" value="text">
            <div class="form-group">
                <label for="sms_text" class="form-label">{{ t('sms_label') }}</label>
                <textarea id="sms_text" name="sms_text" class="form-control" placeholder="{{ t('sms_placeholder') }}" required rows="5"></textarea>
            </div>
            <button type="submit" class="btn-primary-large">{{ t('sms_btn') }}</button>
        </form>

        <!-- Demo Samples -->
        <div class="demo-samples-box">
            <div class="demo-title">{{ t('try_example') }}</div>
            <div class="demo-btn-group">
                <button type="button" class="btn-demo" data-target="sms_text" data-text="Hey John, are we still meeting for lunch tomorrow at 1 PM?">
                    🟢 Safe: Lunch Meeting
                </button>
                <button type="button" class="btn-demo" data-target="sms_text" data-text="Your package #US-9821 has arrived at the regional depot. Please confirm delivery address: https://usps.com/track">
                    🟢 Safe: Package Update
                </button>
                <button type="button" class="btn-demo" data-target="sms_text" data-text="URGENT: Your Bank account has been blocked due to suspicious activity. Verify your identity now at http://bit.ly/bank-security-verify or service will be closed.">
                    🔴 Scam: Bank KYC Block
                </button>
                <button type="button" class="btn-demo" data-target="sms_text" data-text="CONGRATULATIONS! You have won $5,000 in our anniversary giveaway! Claim your prize now at http://192.168.0.50/winner-claim before it expires in 2 hours!">
                    🔴 Scam: Prize Winner
                </button>
            </div>
        </div>
    </div>

    <!-- Form 2: Upload Screenshot -->
    <div id="upload-tab" class="tab-panel" style="display: none;" role="tabpanel">
        <form action="{{ url_for('analyze_sms') }}" method="POST" enctype="multipart/form-data">
            <input type="hidden" name="input_mode" value="screenshot">
            <div class="form-group">
                <label class="form-label">{{ t('sms_upload_label') | default('Select or drop a screenshot of the message:') }}</label>
                <div class="upload-zone" tabindex="0" role="button" aria-label="Upload screenshot file">
                    <div class="upload-zone-icon">🖼️</div>
                    <div class="upload-zone-text">{{ t('upload_drag_drop') }}</div>
                    <div class="upload-zone-sub">{{ t('upload_formats') }}</div>
                    <input type="file" name="screenshot" accept=".png,.jpg,.jpeg,.webp" style="display: none;" required>
                </div>
                
                <div class="file-preview">
                    <div>
                        <strong class="preview-filename">image.png</strong>
                        <span class="preview-filesize" style="color: var(--text-muted);"></span>
                    </div>
                    <button type="button" class="btn-demo btn-clear-file" style="color: var(--danger-color);">{{ t('upload_remove') }}</button>
                </div>
            </div>
            <button type="submit" class="btn-primary-large">{{ t('sms_scan_btn') }}</button>
        </form>
    </div>
</div>
{% endblock %}
